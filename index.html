<!DOCTYPE html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Card Creator – Lernkarten gestalten und drucken</title>
    <meta
      name="description"
      content="Kostenloses Werkzeug, um Lernkarten mit einheitlichem Layout zu gestalten und als PDF oder Word zu drucken – direkt im Browser, ohne Konto."
    />
    <meta name="theme-color" content="#2563eb" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  </head>
  <body>
    <a class="skip-link" href="#main-content">Zum Inhalt springen</a>
    <div class="app-shell">
      <header class="app-header">
        <div class="app-header__brand">
          <img class="app-header__brand-mark" src="/icons/icon-192.png" alt="" width="28" height="28" />
          <span>Card Creator</span>
        </div>
        <div class="app-header__actions btn-group">
          <button id="btn-undo" type="button" class="btn btn--ghost btn--icon" aria-label="Rückgängig (Strg+Z)" title="Rückgängig (Strg+Z)" disabled>
            <span aria-hidden="true">↶</span>
          </button>
          <button id="btn-redo" type="button" class="btn btn--ghost btn--icon" aria-label="Wiederholen (Strg+Y)" title="Wiederholen (Strg+Y)" disabled>
            <span aria-hidden="true">↷</span>
          </button>
          <span id="autosave-status" class="field__hint"></span>
          <button id="btn-save-project" type="button" class="btn btn--secondary btn--sm">Speichern unter …</button>
          <button id="btn-load-project" type="button" class="btn btn--secondary btn--sm">Projekt laden</button>
          <input type="file" id="load-project-input" accept="application/json" class="visually-hidden" aria-hidden="true" tabindex="-1" />
        </div>
      </header>

      <main id="main-content" class="app-main">
        <div class="tab-nav" role="tablist" aria-label="Arbeitsschritte">
          <button class="tab-btn" role="tab" type="button" data-tab="setup" id="tab-setup" aria-controls="panel-setup" aria-selected="true" aria-label="Format">
            <span aria-hidden="true">📐</span><span class="tab-btn__label">Format</span>
          </button>
          <button class="tab-btn" role="tab" type="button" data-tab="design" id="tab-design" aria-controls="panel-design" aria-selected="false" aria-label="Masterkarte">
            <span aria-hidden="true">🎨</span><span class="tab-btn__label">Masterkarte</span>
          </button>
          <button class="tab-btn" role="tab" type="button" data-tab="content" id="tab-content" aria-controls="panel-content" aria-selected="false" aria-label="Inhalte">
            <span aria-hidden="true">📝</span><span class="tab-btn__label">Inhalte</span>
          </button>
          <button class="tab-btn" role="tab" type="button" data-tab="export" id="tab-export" aria-controls="panel-export" aria-selected="false" aria-label="Export">
            <span aria-hidden="true">📤</span><span class="tab-btn__label">Export</span>
          </button>
        </div>

        <!-- ================= Tab 1: Format & Projekt ================= -->
        <section id="panel-setup" class="tab-panel" role="tabpanel" aria-labelledby="tab-setup" tabindex="0">
          <div class="setup-grid" id="setup-grid"></div>
        </section>

        <!-- ================= Tab 2: Masterkarten-Design ================= -->
        <section id="panel-design" class="tab-panel" role="tabpanel" aria-labelledby="tab-design" tabindex="0" hidden>
          <div id="design-workspace"></div>
        </section>

        <!-- ================= Tab 3: Karteninhalte ================= -->
        <section id="panel-content" class="tab-panel" role="tabpanel" aria-labelledby="tab-content" tabindex="0" hidden>
          <div id="content-workspace"></div>
        </section>

        <!-- ================= Tab 4: Export ================= -->
        <section id="panel-export" class="tab-panel" role="tabpanel" aria-labelledby="tab-export" tabindex="0" hidden>
          <div id="export-workspace"></div>
        </section>
      </main>

      <footer id="site-footer" class="site-footer"></footer>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
